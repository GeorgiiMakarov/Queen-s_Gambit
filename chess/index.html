<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр тактики</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:12px;background:#f5f5f5;color:#222}
h1{font-size:20px;margin:8px 0}
.panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}
label{display:block;margin:6px 0}
input,select{font-size:15px;padding:4px}
button{font-size:15px;padding:6px 12px;margin:4px 4px 4px 0;cursor:pointer}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:480px;aspect-ratio:1;border:2px solid #333;margin:8px 0;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative}
.sq.light{background:#ecdcc0}.sq.dark{background:#a9825a}
.sq.sel{outline:3px solid #2a7fff;outline-offset:-3px}
.sq.tgt::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(42,127,255,.55)}
.piece-w{color:#fff;text-shadow:0 0 3px #000,0 0 1px #000}
.piece-b{color:#111;text-shadow:0 0 1px #fff}
#feedback{font-weight:bold;margin:8px 0}
.ok{color:#1a7f37}.bad{color:#c00}
pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px}
small{color:#666}
</style>
</head>
<body>
<h1>Тренажёр тактики</h1>
<div class="panel" id="setup">
<label>Ник Lichess: <input id="nick" placeholder="ник Lichess" size="18">
<button id="fetchBtn">Подтянуть рейтинг</button></label>
<label>Рейтинг задач: <input id="rating" type="number" value="886" min="400" max="3500"></label>
<label>Сет: <select id="setSel"><option value="train">train (практика)</option><option value="test">test (проверка)</option></select></label>
<label>Задач в сессии: <input id="nInput" type="number" value="10" min="1" max="100"></label>
<label><input type="checkbox" id="hintsChk"> Подсказки (тренировка, в статистику не идёт)</label>
<button id="startBtn">Старт</button>
<label>Свои задачи (CSV puzzles_sample.csv): <input type="file" id="csvFile" accept=".csv"></label>
<span id="poolInfo"></span>
</div>
<div class="panel" id="game" style="display:none">
<div id="puzzleInfo"></div>
<div id="board"></div>
<div id="status"></div>
<div id="promoPicker" style="display:none">Превращение:
<button data-p="q">Ферзь</button><button data-p="r">Ладья</button><button data-p="b">Слон</button><button data-p="n">Конь</button>
</div>
<div>
<label>Уверенность: <input type="range" id="conf" min="0" max="100" value="50"> <span id="confVal">50%</span></label>
<button id="submitBtn" disabled>Ответить</button>
</div>
<div id="feedback"></div>
<button id="nextBtn" style="display:none">Следующая</button>
</div>
<div class="panel">
<button id="reportBtn">Отчёт</button>
<button id="exportBtn">Скачать CSV (trainer_log.csv)</button>
<button id="clearBtn">Очистить лог</button>
<pre id="reportOut"></pre>
<small>Рейтинг и темы задачи показываются только после ответа (с галочкой «Подсказки» сразу, но такие строки не попадают в отчёт).
winning = correct: проверка движком «другой выигрыш» в веб-версии недоступна.
Лог хранится в браузере (localStorage), скачивай CSV для архива.</small>
</div>

      var c = lines[i].split(",");
      if (c.length < 5) continue;
      out.push({ id: c[0], fen: c[1], sol: c[2], rating: +c[3], themes: c[4], set: hashSet(c[0]) });
    }
    if (!out.length) { alert("CSV не распознан (нужны колонки PuzzleId,FEN,Solution,Rating,Themes)"); return; }
    POOL = out;
    updatePoolInfo();
    alert("Загружено задач: " + out.length);
  };
  rd.readAsText(f);
});

function renderBoard() {
  var st = session.st;
  var flip = st.turn === "b";
  var boardEl = $("board");
  boardEl.innerHTML = "";
  for (var disp = 0; disp < 64; disp++) {
    var r = Math.floor(disp / 8), f = disp % 8;
    var sq = flip ? (7 - r) * 8 + (7 - f) : r * 8 + f;
    var cell = document.createElement("div");
    cell.className = "sq " + (((Math.floor(sq / 8) + sq % 8) % 2 === 0) ? "light" : "dark");
    cell.dataset.sq = sq;
    var piece = st.board[sq];
    if (piece) {
      var sp = document.createElement("span");
      sp.className = piece.c === "w" ? "piece-w" : "piece-b";
      sp.textContent = GLYPHS[piece.c][piece.t];
      cell.appendChild(sp);
    }
    if (session.selected === sq) cell.classList.add("sel");
    if (session.targets && session.targets.indexOf(sq) !== -1) cell.classList.add("tgt");
    cell.addEventListener("click", function () { onSquare(+this.dataset.sq); });
    boardEl.appendChild(cell);
  }
}
function legalFrom(sq) {
  return session.legal.filter(function (m) { return m.from === sq; });
}
function onSquare(sq) {
  if (session.answered) return;
  var st = session.st;
  if (session.selected === null) {
    var p = st.board[sq];
    if (p && p.c === st.turn) {
      session.selected = sq;
      session.targets = legalFrom(sq).map(function (m) { return m.to; });
      renderBoard();
    }
    return;
  }
  if (sq === session.selected) { session.selected = null; session.targets = []; renderBoard(); return; }
  var cand = legalFrom(session.selected).filter(function (m) { return m.to === sq; });
  if (cand.length) {
    if (cand.length > 1 && cand[0].promotion) {
      // превращение — показать выбор
      session.promoFrom = session.selected; session.promoTo = sq;
      $("promoPicker").style.display = "block";
      return;
    }
    applyMove(cand[0]);
    return;
  }
  var p = st.board[sq];
  if (p && p.c === st.turn) {
    session.selected = sq;
    session.targets = legalFrom(sq).map(function (m) { return m.to; });
    renderBoard();
  }
}
$("promoPicker").addEventListener("click", function (ev) {
  var pr = ev.target.dataset && ev.target.dataset.p;
  if (!pr) return;
  var cand = legalFrom(session.promoFrom).filter(function (m) { return m.to === session.promoTo && m.promotion === pr; });
  $("promoPicker").style.display = "none";
  if (cand.length) applyMove(cand[0]);
});
function applyMove(m) {
  session.pending = m;
  session.st = makeMove(session.st, m);
  session.selected = null; session.targets = [];
  $("submitBtn").disabled = false;
  $("status").textContent = "Твой ход: " + moveUCI(m) + ". Поставь уверенность и нажми «Ответить».";
  renderBoard();
}
function showPuzzle() {
  var p = session.queue[session.i];
  session.puzzle = p;
  session.st = parseFEN(p.fen);
  session.legal = genLegal(session.st, session.st.turn);
  session.selected = null; session.targets = []; session.pending = null; session.answered = false;
  session.t0 = performance.now();
  $("game").style.display = "block";
  $("puzzleInfo").textContent = "[" + (session.i + 1) + "/" + session.queue.length + "] " + p.id +
    (session.hints ? "  рейтинг " + p.rating + "  темы: " + p.themes : "") + "  (" + (session.st.turn === "w" ? "ход белых" : "ход чёрных") + ")";
  $("status").textContent = "Выбери фигуру и клетку назначения.";
  $("feedback").textContent = ""; $("feedback").className = "";
  $("submitBtn").disabled = true;
  $("nextBtn").style.display = "none";
  $("conf").value = 50; $("confVal").textContent = "50%";
  renderBoard();
}
$("startBtn").addEventListener("click", function () {
  var setName = $("setSel").value;
  var n = Math.max(1, Math.min(100, +$("nInput").value || 10));
  var rating = +$("rating").value || 886;
  var solved = {};
  for (var r of log) solved[r.puzzle_id] = true;
  var pool = POOL.filter(function (p) { return p.set === setName && !solved[p.id]; });
  if (pool.length < n) pool = POOL.filter(function (p) { return p.set === setName; });
  // перетасовать
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  var queue = pool.slice(0, Math.min(n, pool.length));
  if (!queue.length) { alert("Нет задач в сете " + setName); return; }
  session = { queue: queue, i: 0, rating: rating, setName: setName,
    hints: !!$("hintsChk").checked, user: ($("nick").value.trim() || "anon"), id: newSessionId() };
  showPuzzle();
});
$("submitBtn").addEventListener("click", function () {
  if (!session.pending || session.answered) return;
  session.answered = true;
  var dt = (performance.now() - session.t0) / 1000;
  var mv = moveUCI(session.pending);
  var p = session.puzzle;
  var correct = (mv === p.sol);
  var conf = +$("conf").value;
  var exp = expectedP(session.rating, p.rating);
  log.push({ ts: new Date().toISOString(), user: session.user, session: session.id,
    puzzle_id: p.id, rating: p.rating, themes: p.themes, set: session.setName, move: mv,
    solution: p.sol, confidence: conf, correct: correct ? 1 : 0, winning: correct ? 1 : 0,
    seconds: Math.round(dt * 10) / 10, expected: Math.round(exp * 1000) / 1000,
    hints: session.hints ? 1 : 0, mode: "classic", line: "", depth: "", strict: "", timeout: 0 });
  saveLog();
  $("feedback").textContent = (correct ? "ВЕРНО" : "МИМО (решение: " + p.sol + ")") +
    ". Рейтинг задачи " + p.rating + ", темы: " + p.themes + ". Ожидаемый шанс: " + Math.round(exp * 100) + "%. Время: " + dt.toFixed(1) + " c.";
  $("feedback").className = correct ? "ok" : "bad";
  $("submitBtn").disabled = true;
  $("nextBtn").style.display = "inline-block";
  updatePoolInfo();
});
$("nextBtn").addEventListener("click", function () {
  session.i++;
  if (session.i >= session.queue.length) {
    $("game").style.display = "none";
    $("reportOut").textContent = "--- итог сессии ---\n" + buildReport(log);
  } else showPuzzle();
});
$("reportBtn").addEventListener("click", function () { $("reportOut").textContent = buildReport(log); });
$("exportBtn").addEventListener("click", function () {
  var F = LOG_FIELDS;
  var lines = [F.join(",")];
  for (var r of log) lines.push(F.map(function (k) { return csvCell(r[k]); }).join(","));
  var blob = new Blob([lines.join("\n")], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "trainer_log.csv"; a.click();
});
$("clearBtn").addEventListener("click", function () {
  if (!confirm("Очистить весь лог?")) return;
  log = []; saveLog(); updatePoolInfo(); $("reportOut").textContent = "лог очищен";
});
</script>
</body>
</html>
