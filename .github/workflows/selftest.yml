name: Selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 common/test_common.py
      - run: python3 common/test_stats.py
      - run: python3 common/make_golden.py --check
      - run: python3 mahjong/danger_ev.v041_frozen.py
